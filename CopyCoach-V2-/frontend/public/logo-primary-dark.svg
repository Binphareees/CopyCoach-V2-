<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220">
  <defs>
    <!-- Gradients & Glows -->
    <linearGradient id="cyan-bolt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00C8FF" />
    </linearGradient>

    <linearGradient id="nib-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0099FF" />
    </linearGradient>

    <filter id="icon-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#00E0FF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Logo Icon Container (Matches Dark Image) -->
  <g transform="translate(20, 20)" filter="url(#icon-shadow)">
    <!-- Dark Navy Squircle Background Badge -->
    <rect x="0" y="0" width="180" height="180" rx="42" fill="#0D1938" stroke="#1E2F5D" stroke-width="2"/>

    <!-- Speech Bubble Outline (White) -->
    <path d="M 90 35 C 122 35 148 61 148 93 C 148 112 138 129 123 140 L 128 156 C 129 159 126 161 123 160 L 105 148 C 100 150 95 151 90 151 C 58 151 32 125 32 93 C 32 61 58 35 90 35 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Pen Nib inside speech bubble -->
    <!-- Left Half (White) -->
    <path d="M 90 62 L 62 108 C 62 118 72 124 82 122 L 90 120 Z" fill="#FFFFFF" />
    <!-- Right Half (Cyan/Blue) -->
    <path d="M 90 62 L 118 108 C 118 118 108 124 98 122 L 90 120 Z" fill="url(#nib-blue-grad)" />
    <!-- Nib Center Breather Hole & Split Line -->
    <circle cx="90" cy="100" r="4" fill="#0D1938" />
    <line x1="90" y1="64" x2="90" y2="100" stroke="#0D1938" stroke-width="3" stroke-linecap="round"/>

    <!-- Lightning Bolt Breaking Out Top-Right -->
    <polygon points="135,32 165,32 145,68 172,68 125,115 138,76 118,76" fill="url(#cyan-bolt-grad)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(230, 138)">
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="68" font-weight="800" letter-spacing="-1" fill="#FFFFFF">
      CopyCoach
    </text>
    
    <!-- AI Pill Badge -->
    <g transform="translate(372, -56)">
      <rect x="0" y="0" width="102" height="60" rx="16" fill="#00E0FF" />
      <text x="51" y="42" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="0.5" fill="#0B132B" text-anchor="middle">
        AI
      </text>
    </g>
  </g>
</svg>
