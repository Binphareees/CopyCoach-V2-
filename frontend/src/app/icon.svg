<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="brainGradIcon" x1="10" y1="20" x2="190" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="pencilGradIcon" x1="30" y1="170" x2="160" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="eraserGradIcon" x1="130" y1="20" x2="170" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="4" y="4" width="192" height="192" rx="44" fill="#0F172A" stroke="#1E293B" stroke-width="3"/>

  <!-- Neural Brain Network - Left hemisphere -->
  <path d="M 80 44 C 55 36 28 52 28 78 C 25 98 38 116 50 126 C 43 138 55 156 76 152 C 88 149 93 136 93 122 Z"
    fill="url(#brainGradIcon)" fill-opacity="0.25" stroke="url(#brainGradIcon)" stroke-width="3" stroke-linecap="round"/>
  <!-- Neural Brain Network - Right hemisphere -->
  <path d="M 93 44 C 118 36 145 52 145 78 C 148 98 135 116 123 126 C 130 138 118 156 97 152 C 85 149 80 136 80 122 Z"
    fill="url(#brainGradIcon)" fill-opacity="0.18" stroke="url(#brainGradIcon)" stroke-width="3" stroke-linecap="round"/>

  <!-- Neural Network Nodes -->
  <circle cx="42" cy="66" r="5" fill="#2563EB"/>
  <circle cx="62" cy="55" r="4.5" fill="#3b82f6"/>
  <circle cx="82" cy="48" r="3.5" fill="#6366f1"/>
  <circle cx="104" cy="58" r="4.5" fill="#7c3aed"/>
  <circle cx="126" cy="74" r="5" fill="#7c3aed"/>
  <circle cx="48" cy="88" r="4" fill="#2563EB"/>
  <circle cx="75" cy="80" r="4" fill="#3b82f6"/>
  <circle cx="98" cy="88" r="3.5" fill="#6366f1"/>
  <circle cx="58" cy="108" r="4" fill="#7c3aed"/>
  <circle cx="82" cy="103" r="3.5" fill="#2563EB"/>

  <!-- Neural Connections -->
  <line x1="42" y1="66" x2="62" y2="55" stroke="#2563EB" stroke-width="2" opacity="0.55"/>
  <line x1="62" y1="55" x2="82" y2="48" stroke="#3b82f6" stroke-width="2" opacity="0.55"/>
  <line x1="82" y1="48" x2="104" y2="58" stroke="#6366f1" stroke-width="2" opacity="0.55"/>
  <line x1="104" y1="58" x2="126" y2="74" stroke="#7c3aed" stroke-width="2" opacity="0.55"/>
  <line x1="48" y1="88" x2="75" y2="80" stroke="#2563EB" stroke-width="2" opacity="0.5"/>
  <line x1="75" y1="80" x2="98" y2="88" stroke="#3b82f6" stroke-width="2" opacity="0.5"/>
  <line x1="58" y1="108" x2="82" y2="103" stroke="#7c3aed" stroke-width="2" opacity="0.5"/>
  <line x1="42" y1="66" x2="48" y2="88" stroke="#2563EB" stroke-width="1.5" opacity="0.4"/>
  <line x1="62" y1="55" x2="75" y2="80" stroke="#3b82f6" stroke-width="1.5" opacity="0.4"/>
  <line x1="82" y1="48" x2="98" y2="88" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
  <line x1="104" y1="58" x2="82" y2="103" stroke="#7c3aed" stroke-width="1.5" opacity="0.4"/>
  <line x1="48" y1="88" x2="58" y2="108" stroke="#2563EB" stroke-width="1.5" opacity="0.35"/>
  <line x1="75" y1="80" x2="58" y2="108" stroke="#3b82f6" stroke-width="1.5" opacity="0.35"/>

  <!-- Analytics Signal Bars (top-left) -->
  <rect x="32" y="38" width="3.5" height="10" rx="1.5" fill="#2563EB" opacity="0.8"/>
  <rect x="38" y="32" width="3.5" height="16" rx="1.5" fill="#3b82f6" opacity="0.8"/>
  <rect x="44" y="26" width="3.5" height="22" rx="1.5" fill="#6366f1" opacity="0.8"/>

  <!-- Analytics Signal Bars (top-right) -->
  <rect x="142" y="42" width="3" height="10" rx="1.5" fill="#7c3aed" opacity="0.7"/>
  <rect x="148" y="36" width="3" height="16" rx="1.5" fill="#7c3aed" opacity="0.6"/>

  <!-- Angled Pencil with Coach Silhouette -->
  <g transform="rotate(-38 93 95)">
    <!-- Pencil body -->
    <rect x="74" y="32" width="38" height="112" rx="13" fill="url(#pencilGradIcon)" stroke="#0F172A" stroke-width="4"/>
    <!-- Eraser -->
    <path d="M 74 44 C 74 34 112 34 112 44 L 112 54 L 74 54 Z" fill="url(#eraserGradIcon)" stroke="#0F172A" stroke-width="3"/>
    <line x1="74" y1="54" x2="112" y2="54" stroke="#CBD5E1" stroke-width="4"/>

    <!-- Coach Silhouette - Head -->
    <circle cx="93" cy="68" r="6" fill="#FFFFFF"/>
    <!-- Coach Silhouette - Body -->
    <path d="M 83 90 C 83 78 103 78 103 90 L 103 112 L 83 112 Z" fill="#FFFFFF"/>
    <!-- Coach Silhouette - Pointer arm -->
    <line x1="99" y1="82" x2="112" y2="68" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

    <!-- Pencil Tip -->
    <path d="M 74 142 L 93 172 L 112 142 Z" fill="#0F172A"/>
    <path d="M 80 142 L 93 164 L 106 142 Z" fill="#F8FAFC"/>
    <path d="M 88 154 L 93 166 L 98 154 Z" fill="#2563EB"/>
  </g>

  <!-- Writing Tip Glow -->
  <circle cx="34" cy="158" r="9" fill="#2563EB"/>
  <circle cx="34" cy="158" r="18" fill="#2563EB" opacity="0.2"/>
</svg>
