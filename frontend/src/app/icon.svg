<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="brainGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>
    <linearGradient id="pencilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="192" height="192" rx="48" fill="#0B132B" stroke="#1E293B" stroke-width="4" />

  <!-- Brain Network -->
  <g stroke="url(#brainGlow)" stroke-width="3" opacity="0.85">
    <line x1="50" y1="75" x2="75" y2="48" />
    <line x1="75" y1="48" x2="115" y2="55" />
    <line x1="50" y1="75" x2="62" y2="108" />
    <line x1="62" y1="108" x2="95" y2="118" />
    <line x1="75" y1="48" x2="95" y2="88" />

    <circle cx="50" cy="75" r="5.5" fill="#00f5d4" />
    <circle cx="75" cy="48" r="6.5" fill="#00b4d8" />
    <circle cx="115" cy="55" r="5.5" fill="#7209b7" />
    <circle cx="62" cy="108" r="5.5" fill="#00f5d4" />
    <circle cx="95" cy="118" r="6.5" fill="#00b4d8" />
    <circle cx="95" cy="88" r="4.5" fill="#ffffff" />
  </g>

  <!-- Pencil -->
  <g transform="rotate(-35 100 100)">
    <rect x="86" y="30" width="28" height="110" rx="6" fill="url(#pencilGrad)" stroke="#ffffff" stroke-width="4.5" />
    
    <!-- Eraser -->
    <path d="M 86 44 L 114 44 L 114 35 C 114 31 110 27 106 27 L 94 27 C 90 27 86 31 86 35 Z" fill="#7209b7" stroke="#ffffff" stroke-width="2" />
    <line x1="86" y1="44" x2="114" y2="44" stroke="#ffffff" stroke-width="2" />
    
    <!-- Pencil tip -->
    <path d="M 86 140 L 100 168 L 114 140 Z" fill="#00b4d8" />
    <polygon points="95,158 100,168 105,158" fill="#0B132B" />
    
    <!-- Coach silhouette -->
    <circle cx="100" cy="72" r="5.5" fill="#ffffff" />
    <path d="M 92 92 C 92 82 108 82 108 92 L 108 112 L 92 112 Z" fill="#ffffff" />
    <!-- Pointer arm -->
    <line x1="104" y1="88" x2="114" y2="80" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Writing tip glow -->
  <circle cx="48" cy="153" r="7.5" fill="#00f5d4" />
  <circle cx="48" cy="153" r="15" fill="#00f5d4" opacity="0.3" />
</svg>
