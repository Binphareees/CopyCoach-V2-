<svg viewBox="0 0 380 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brainGradLight" x1="10" y1="10" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="pencilGradLight" x1="10" y1="70" x2="70" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="eraserGradLight" x1="55" y1="10" x2="75" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
  </defs>

  <!-- ICON MARK -->
  <g transform="translate(10, 5) scale(0.65)">
    <!-- Neural Brain Network - Left -->
    <path d="M 48 28 C 33 23 18 33 18 48 C 16 60 23 70 30 76 C 26 83 33 93 46 90 C 53 88 56 80 56 73 Z"
      fill="url(#brainGradLight)" fill-opacity="0.25" stroke="url(#brainGradLight)" stroke-width="2" stroke-linecap="round"/>
    <!-- Neural Brain Network - Right -->
    <path d="M 56 28 C 71 23 86 33 86 48 C 88 60 81 70 74 76 C 78 83 71 93 58 90 C 51 88 48 80 48 73 Z"
      fill="url(#brainGradLight)" fill-opacity="0.18" stroke="url(#brainGradLight)" stroke-width="2" stroke-linecap="round"/>

    <!-- Neural Network Nodes -->
    <circle cx="26" cy="40" r="3" fill="#2563EB"/>
    <circle cx="38" cy="34" r="2.5" fill="#3b82f6"/>
    <circle cx="50" cy="30" r="2" fill="#6366f1"/>
    <circle cx="63" cy="36" r="2.5" fill="#7c3aed"/>
    <circle cx="76" cy="46" r="3" fill="#7c3aed"/>
    <circle cx="30" cy="53" r="2.5" fill="#2563EB"/>
    <circle cx="46" cy="48" r="2.5" fill="#3b82f6"/>
    <circle cx="60" cy="53" r="2" fill="#6366f1"/>

    <!-- Neural Connections -->
    <line x1="26" y1="40" x2="38" y2="34" stroke="#2563EB" stroke-width="1.2" opacity="0.55"/>
    <line x1="38" y1="34" x2="50" y2="30" stroke="#3b82f6" stroke-width="1.2" opacity="0.55"/>
    <line x1="50" y1="30" x2="63" y2="36" stroke="#6366f1" stroke-width="1.2" opacity="0.55"/>
    <line x1="63" y1="36" x2="76" y2="46" stroke="#7c3aed" stroke-width="1.2" opacity="0.55"/>
    <line x1="30" y1="53" x2="46" y2="48" stroke="#2563EB" stroke-width="1.2" opacity="0.5"/>
    <line x1="46" y1="48" x2="60" y2="53" stroke="#3b82f6" stroke-width="1.2" opacity="0.5"/>

    <!-- Signal Bars -->
    <rect x="20" y="24" width="2" height="6" rx="1" fill="#2563EB" opacity="0.8"/>
    <rect x="24" y="20" width="2" height="10" rx="1" fill="#3b82f6" opacity="0.8"/>
    <rect x="28" y="17" width="2" height="13" rx="1" fill="#6366f1" opacity="0.8"/>
    <rect x="86" y="26" width="2" height="6" rx="1" fill="#7c3aed" opacity="0.7"/>
    <rect x="90" y="23" width="2" height="9" rx="1" fill="#7c3aed" opacity="0.6"/>

    <!-- Pencil -->
    <g transform="rotate(-38 56 58)">
      <rect x="44" y="20" width="24" height="68" rx="8" fill="url(#pencilGradLight)" stroke="#0F172A" stroke-width="2.5"/>
      <path d="M 44 26 C 44 20 68 20 68 26 L 68 32 L 44 32 Z" fill="url(#eraserGradLight)" stroke="#0F172A" stroke-width="2"/>
      <line x1="44" y1="32" x2="68" y2="32" stroke="#CBD5E1" stroke-width="2.5"/>
      <circle cx="56" cy="42" r="3.5" fill="#FFFFFF"/>
      <path d="M 50 56 C 50 48 62 48 62 56 L 62 68 L 50 68 Z" fill="#FFFFFF"/>
      <line x1="60" y1="50" x2="68" y2="42" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M 44 86 L 56 102 L 68 86 Z" fill="#0F172A"/>
      <path d="M 48 86 L 56 98 L 64 86 Z" fill="#F8FAFC"/>
      <path d="M 53 93 L 56 100 L 59 93 Z" fill="#2563EB"/>
    </g>

    <!-- Writing Tip Glow -->
    <circle cx="20" cy="96" r="5.5" fill="#2563EB"/>
    <circle cx="20" cy="96" r="11" fill="#2563EB" opacity="0.2"/>
  </g>

  <!-- BRAND NAME -->
  <text x="95" y="42" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="900" font-size="32" fill="#0F172A" letter-spacing="-0.5">CopyCoach </text>
  <text x="226" y="42" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="900" font-size="32" fill="#2563EB" letter-spacing="-0.5">AI</text>
  <!-- TAGLINE -->
  <text x="96" y="64" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="500" font-size="14" fill="#475569" letter-spacing="0.3">Elevate Your Copywriting with AI</text>
</svg>
