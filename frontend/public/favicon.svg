<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favBrain" x1="20" y1="20" x2="80" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>
    <linearGradient id="favPencil" x1="46" y1="90" x2="74" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>
    <linearGradient id="favEraser" x1="80" y1="15" x2="100" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="116" height="116" rx="30" fill="#0B132B" />

  <!-- Brain Network -->
  <path d="M 50 30 C 35 25 20 35 20 50 C 18 62 25 72 32 78 C 28 85 35 95 48 92 C 55 90 58 82 58 75 Z" fill="url(#favBrain)" fill-opacity="0.3" stroke="url(#favBrain)" stroke-width="2.5" />
  <path d="M 58 30 C 73 25 88 35 88 50 C 90 62 83 72 76 78 C 80 85 73 95 60 92 C 53 90 50 82 50 75 Z" fill="url(#favBrain)" fill-opacity="0.2" stroke="url(#favBrain)" stroke-width="2.5" />

  <!-- Neural network nodes -->
  <circle cx="28" cy="42" r="3.5" fill="#00f5d4" />
  <circle cx="42" cy="35" r="3" fill="#00b4d8" />
  <circle cx="55" cy="32" r="2.5" fill="#818CF8" />
  <circle cx="68" cy="38" r="3" fill="#C084FC" />
  <circle cx="78" cy="48" r="3.5" fill="#7209b7" />
  <circle cx="35" cy="55" r="2.5" fill="#00f5d4" />
  <circle cx="50" cy="50" r="3" fill="#00b4d8" />
  <circle cx="65" cy="55" r="2.5" fill="#818CF8" />
  <circle cx="40" cy="70" r="3" fill="#C084FC" />
  <circle cx="55" cy="68" r="2.5" fill="#7209b7" />

  <!-- Neural network connections -->
  <line x1="28" y1="42" x2="42" y2="35" stroke="#00f5d4" stroke-width="1.5" opacity="0.6" />
  <line x1="42" y1="35" x2="55" y2="32" stroke="#00b4d8" stroke-width="1.5" opacity="0.6" />
  <line x1="55" y1="32" x2="68" y2="38" stroke="#818CF8" stroke-width="1.5" opacity="0.6" />
  <line x1="68" y1="38" x2="78" y2="48" stroke="#C084FC" stroke-width="1.5" opacity="0.6" />
  <line x1="35" y1="55" x2="50" y2="50" stroke="#00f5d4" stroke-width="1.5" opacity="0.6" />
  <line x1="50" y1="50" x2="65" y2="55" stroke="#00b4d8" stroke-width="1.5" opacity="0.6" />
  <line x1="40" y1="70" x2="55" y2="68" stroke="#C084FC" stroke-width="1.5" opacity="0.6" />
  <line x1="28" y1="42" x2="35" y2="55" stroke="#00f5d4" stroke-width="1.5" opacity="0.5" />
  <line x1="42" y1="35" x2="50" y2="50" stroke="#00b4d8" stroke-width="1.5" opacity="0.5" />
  <line x1="55" y1="32" x2="65" y2="55" stroke="#818CF8" stroke-width="1.5" opacity="0.5" />
  <line x1="68" y1="38" x2="55" y2="68" stroke="#C084FC" stroke-width="1.5" opacity="0.5" />

  <!-- Pencil -->
  <g transform="rotate(-38 58 60)">
    <rect x="46" y="22" width="24" height="68" rx="8" fill="url(#favPencil)" stroke="#0F172A" stroke-width="3" />
    <path d="M 46 28 C 46 22 70 22 70 28 L 70 34 L 46 34 Z" fill="url(#favEraser)" stroke="#0F172A" stroke-width="2.5" />
    <!-- Coach silhouette -->
    <circle cx="58" cy="44" r="4" fill="#FFFFFF" />
    <path d="M 52 58 C 52 50 64 50 64 58 L 64 70 L 52 70 Z" fill="#FFFFFF" />
    <!-- Pointer arm -->
    <line x1="62" y1="52" x2="70" y2="44" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Writing tip glow -->
  <circle cx="36" cy="92" r="5" fill="#00f5d4" />
  <circle cx="36" cy="92" r="10" fill="#00f5d4" opacity="0.3" />
</svg>
