<svg viewBox="0 0 380 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brainGradDark" x1="10" y1="10" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>

    <linearGradient id="pencilGradDark" x1="10" y1="70" x2="70" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>

    <linearGradient id="textGradAiDark" x1="250" y1="0" x2="310" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
  </defs>

  <!-- ICON MARK -->
  <g transform="translate(10, 5) scale(0.65)">
    <!-- Brain Network -->
    <path d="M 50 30 C 35 25 20 35 20 50 C 18 62 25 72 32 78 C 28 85 35 95 48 92 C 55 90 58 82 58 75 Z" fill="url(#brainGradDark)" fill-opacity="0.3" stroke="url(#brainGradDark)" stroke-width="2.5" />
    <path d="M 58 30 C 73 25 88 35 88 50 C 90 62 83 72 76 78 C 80 85 73 95 60 92 C 53 90 50 82 50 75 Z" fill="url(#brainGradDark)" fill-opacity="0.2" stroke="url(#brainGradDark)" stroke-width="2.5" />

    <!-- Neural Network Nodes -->
    <circle cx="28" cy="42" r="3" fill="#00f5d4" />
    <circle cx="40" cy="36" r="2.5" fill="#00b4d8" />
    <circle cx="52" cy="32" r="2" fill="#818CF8" />
    <circle cx="65" cy="38" r="2.5" fill="#C084FC" />
    <circle cx="78" cy="48" r="3" fill="#7209b7" />
    <circle cx="32" cy="55" r="2.5" fill="#00f5d4" />
    <circle cx="48" cy="50" r="2.5" fill="#00b4d8" />
    <circle cx="62" cy="55" r="2" fill="#818CF8" />

    <!-- Pencil Coach -->
    <g transform="rotate(-38 58 60)">
      <rect x="46" y="22" width="24" height="68" rx="8" fill="url(#pencilGradDark)" stroke="#0F172A" stroke-width="3" />
      <circle cx="58" cy="44" r="3.5" fill="#FFFFFF" />
      <path d="M 52 58 C 52 50 64 50 64 58 L 64 70 L 52 70 Z" fill="#FFFFFF" />
      <line x1="62" y1="52" x2="70" y2="44" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
      <path d="M 46 88 L 58 104 L 70 88 Z" fill="#0F172A" />
      <path d="M 50 88 L 58 100 L 66 88 Z" fill="#F8FAFC" />
    </g>

    <!-- Writing Tip Glow -->
    <circle cx="21" cy="98" r="6" fill="#00f5d4" />
    <circle cx="21" cy="98" r="12" fill="#00f5d4" opacity="0.25" />
  </g>

  <!-- BRAND NAME & TAGLINE -->
  <text x="95" y="44" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="32" fill="#FFFFFF" letter-spacing="-0.5">CopyCoach <tspan fill="url(#textGradAiDark)">AI</tspan></text>
  <text x="96" y="66" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="15" fill="#94A3B8" letter-spacing="0.2">Elevate Your Copywriting with AI</text>
</svg>
