<svg viewBox="0 0 280 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoDarkGrad" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="logoDarkSpark" x1="10" y1="10" x2="50" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <linearGradient id="textGrad" x1="120" y1="0" x2="220" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>

  <!-- Symbol Icon -->
  <g transform="translate(4, 4)">
    <rect x="2" y="2" width="48" height="48" rx="14" fill="url(#logoDarkGrad)" />
    <path d="M 38 18 C 33 12 21 12 16 19 C 10 26 10 35 16 41 C 21 47 33 47 38 40" stroke="white" stroke-width="5.5" stroke-linecap="round" />
    <path d="M 29 18 L 38 27 L 29 36 L 31 27 Z" fill="url(#logoDarkSpark)" />
    <circle cx="40" cy="15" r="2.5" fill="#38BDF8" />
  </g>

  <!-- Brand Typography for Dark Mode -->
  <text x="68" y="38" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" letter-spacing="-0.5">Copy<tspan fill="url(#textGrad)">Coach</tspan></text>

  <!-- AI Badge -->
  <rect x="232" y="22" width="28" height="18" rx="5" fill="#06B6D4" fill-opacity="0.18" stroke="#06B6D4" stroke-opacity="0.4" />
  <text x="246" y="34" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" fill="#38BDF8" text-anchor="middle">AI</text>
</svg>
