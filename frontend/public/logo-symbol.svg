<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brainGrad" x1="10" y1="20" x2="110" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="pencilGrad" x1="20" y1="100" x2="90" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="eraserGrad" x1="80" y1="15" x2="100" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="tipGlow" x1="15" y1="90" x2="30" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Neural Brain Network - Left hemisphere -->
  <path d="M 48 28 C 33 23 18 33 18 48 C 16 60 23 70 30 76 C 26 83 33 93 46 90 C 53 88 56 80 56 73 Z"
    fill="url(#brainGrad)" fill-opacity="0.25" stroke="url(#brainGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Neural Brain Network - Right hemisphere -->
  <path d="M 56 28 C 71 23 86 33 86 48 C 88 60 81 70 74 76 C 78 83 71 93 58 90 C 51 88 48 80 48 73 Z"
    fill="url(#brainGrad)" fill-opacity="0.18" stroke="url(#brainGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Neural Network Nodes -->
  <circle cx="26" cy="40" r="3" fill="#2563EB"/>
  <circle cx="38" cy="34" r="2.5" fill="#3b82f6"/>
  <circle cx="50" cy="30" r="2" fill="#6366f1"/>
  <circle cx="63" cy="36" r="2.5" fill="#7c3aed"/>
  <circle cx="76" cy="46" r="3" fill="#7c3aed"/>
  <circle cx="30" cy="53" r="2.5" fill="#2563EB"/>
  <circle cx="46" cy="48" r="2.5" fill="#3b82f6"/>
  <circle cx="60" cy="53" r="2" fill="#6366f1"/>
  <circle cx="36" cy="66" r="2.5" fill="#7c3aed"/>
  <circle cx="50" cy="63" r="2" fill="#2563EB"/>

  <!-- Neural Connections -->
  <line x1="26" y1="40" x2="38" y2="34" stroke="#2563EB" stroke-width="1.2" opacity="0.55"/>
  <line x1="38" y1="34" x2="50" y2="30" stroke="#3b82f6" stroke-width="1.2" opacity="0.55"/>
  <line x1="50" y1="30" x2="63" y2="36" stroke="#6366f1" stroke-width="1.2" opacity="0.55"/>
  <line x1="63" y1="36" x2="76" y2="46" stroke="#7c3aed" stroke-width="1.2" opacity="0.55"/>
  <line x1="30" y1="53" x2="46" y2="48" stroke="#2563EB" stroke-width="1.2" opacity="0.5"/>
  <line x1="46" y1="48" x2="60" y2="53" stroke="#3b82f6" stroke-width="1.2" opacity="0.5"/>
  <line x1="36" y1="66" x2="50" y2="63" stroke="#7c3aed" stroke-width="1.2" opacity="0.5"/>
  <line x1="26" y1="40" x2="30" y2="53" stroke="#2563EB" stroke-width="1" opacity="0.4"/>
  <line x1="38" y1="34" x2="46" y2="48" stroke="#3b82f6" stroke-width="1" opacity="0.4"/>
  <line x1="50" y1="30" x2="60" y2="53" stroke="#6366f1" stroke-width="1" opacity="0.4"/>
  <line x1="63" y1="36" x2="50" y2="63" stroke="#7c3aed" stroke-width="1" opacity="0.4"/>
  <line x1="30" y1="53" x2="36" y2="66" stroke="#2563EB" stroke-width="1" opacity="0.35"/>
  <line x1="46" y1="48" x2="36" y2="66" stroke="#3b82f6" stroke-width="1" opacity="0.35"/>

  <!-- Analytics Signal Bars (top-left) -->
  <rect x="20" y="24" width="2" height="6" rx="1" fill="#2563EB" opacity="0.8"/>
  <rect x="24" y="20" width="2" height="10" rx="1" fill="#3b82f6" opacity="0.8"/>
  <rect x="28" y="17" width="2" height="13" rx="1" fill="#6366f1" opacity="0.8"/>

  <!-- Analytics Signal Bars (top-right) -->
  <rect x="86" y="26" width="2" height="6" rx="1" fill="#7c3aed" opacity="0.7"/>
  <rect x="90" y="23" width="2" height="9" rx="1" fill="#7c3aed" opacity="0.6"/>

  <!-- Angled Pencil with Coach Silhouette -->
  <g transform="rotate(-38 56 58)">
    <!-- Pencil body -->
    <rect x="44" y="20" width="24" height="68" rx="8" fill="url(#pencilGrad)" stroke="#0F172A" stroke-width="2.5"/>
    <!-- Eraser -->
    <path d="M 44 26 C 44 20 68 20 68 26 L 68 32 L 44 32 Z" fill="url(#eraserGrad)" stroke="#0F172A" stroke-width="2"/>
    <line x1="44" y1="32" x2="68" y2="32" stroke="#CBD5E1" stroke-width="2.5"/>

    <!-- Coach Silhouette - Head -->
    <circle cx="56" cy="42" r="3.5" fill="#FFFFFF"/>
    <!-- Coach Silhouette - Body -->
    <path d="M 50 56 C 50 48 62 48 62 56 L 62 68 L 50 68 Z" fill="#FFFFFF"/>
    <!-- Coach Silhouette - Pointer arm -->
    <line x1="60" y1="50" x2="68" y2="42" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Pencil Tip -->
    <path d="M 44 86 L 56 102 L 68 86 Z" fill="#0F172A"/>
    <path d="M 48 86 L 56 98 L 64 86 Z" fill="#F8FAFC"/>
    <path d="M 53 93 L 56 100 L 59 93 Z" fill="#2563EB"/>
  </g>

  <!-- Writing Tip Glow -->
  <circle cx="20" cy="96" r="5.5" fill="#2563EB"/>
  <circle cx="20" cy="96" r="11" fill="#2563EB" opacity="0.2"/>
</svg>
