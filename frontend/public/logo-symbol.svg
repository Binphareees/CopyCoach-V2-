<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brainGrad" x1="10" y1="20" x2="110" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>

    <linearGradient id="pencilGrad" x1="20" y1="100" x2="90" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#7209b7" />
    </linearGradient>

    <linearGradient id="eraserGrad" x1="80" y1="15" x2="100" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7E22CE" />
    </linearGradient>
  </defs>

  <!-- Deep Navy Rounded Container Base -->
  <rect x="2" y="2" width="116" height="116" rx="28" fill="#0B132B" stroke="#1E293B" stroke-width="2" />

  <!-- Neural Brain Network -->
  <path d="M 50 30 C 35 25 20 35 20 50 C 18 62 25 72 32 78 C 28 85 35 95 48 92 C 55 90 58 82 58 75 Z" fill="url(#brainGrad)" fill-opacity="0.3" stroke="url(#brainGrad)" stroke-width="2" />
  <path d="M 58 30 C 73 25 88 35 88 50 C 90 62 83 72 76 78 C 80 85 73 95 60 92 C 53 90 50 82 50 75 Z" fill="url(#brainGrad)" fill-opacity="0.2" stroke="url(#brainGrad)" stroke-width="2" />

  <!-- Neural Network Nodes -->
  <circle cx="28" cy="42" r="3" fill="#00f5d4" />
  <circle cx="40" cy="36" r="2.5" fill="#00b4d8" />
  <circle cx="52" cy="32" r="2" fill="#818CF8" />
  <circle cx="65" cy="38" r="2.5" fill="#C084FC" />
  <circle cx="78" cy="48" r="3" fill="#7209b7" />
  <circle cx="32" cy="55" r="2.5" fill="#00f5d4" />
  <circle cx="48" cy="50" r="2.5" fill="#00b4d8" />
  <circle cx="62" cy="55" r="2" fill="#818CF8" />
  <circle cx="38" cy="68" r="2.5" fill="#C084FC" />
  <circle cx="52" cy="65" r="2" fill="#7209b7" />

  <!-- Neural Connections -->
  <line x1="28" y1="42" x2="40" y2="36" stroke="#00f5d4" stroke-width="1.2" opacity="0.6" />
  <line x1="40" y1="36" x2="52" y2="32" stroke="#00b4d8" stroke-width="1.2" opacity="0.6" />
  <line x1="52" y1="32" x2="65" y2="38" stroke="#818CF8" stroke-width="1.2" opacity="0.6" />
  <line x1="65" y1="38" x2="78" y2="48" stroke="#C084FC" stroke-width="1.2" opacity="0.6" />
  <line x1="32" y1="55" x2="48" y2="50" stroke="#00f5d4" stroke-width="1.2" opacity="0.6" />
  <line x1="48" y1="50" x2="62" y2="55" stroke="#00b4d8" stroke-width="1.2" opacity="0.6" />
  <line x1="38" y1="68" x2="52" y2="65" stroke="#C084FC" stroke-width="1.2" opacity="0.6" />
  <line x1="28" y1="42" x2="32" y2="55" stroke="#00f5d4" stroke-width="1.2" opacity="0.5" />
  <line x1="40" y1="36" x2="48" y2="50" stroke="#00b4d8" stroke-width="1.2" opacity="0.5" />
  <line x1="52" y1="32" x2="62" y2="55" stroke="#818CF8" stroke-width="1.2" opacity="0.5" />
  <line x1="65" y1="38" x2="52" y2="65" stroke="#C084FC" stroke-width="1.2" opacity="0.5" />

  <!-- Analytics Signal Bars -->
  <rect x="22" y="26" width="2" height="6" rx="1" fill="#00f5d4" />
  <rect x="26" y="22" width="2" height="10" rx="1" fill="#00b4d8" />
  <rect x="30" y="19" width="2" height="13" rx="1" fill="#818CF8" />

  <rect x="88" y="28" width="2" height="6" rx="1" fill="#C084FC" />
  <rect x="92" y="25" width="2" height="9" rx="1" fill="#7209b7" />

  <!-- Angled Pencil with Coach Silhouette -->
  <g transform="rotate(-38 58 60)">
    <rect x="46" y="22" width="24" height="68" rx="8" fill="url(#pencilGrad)" stroke="#0F172A" stroke-width="3" />
    <path d="M 46 28 C 46 22 70 22 70 28 L 70 34 L 46 34 Z" fill="url(#eraserGrad)" stroke="#0F172A" stroke-width="2.5" />
    <line x1="46" y1="34" x2="70" y2="34" stroke="#CBD5E1" stroke-width="3" />

    <!-- Coach Silhouette -->
    <circle cx="58" cy="44" r="3.5" fill="#FFFFFF" />
    <path d="M 52 58 C 52 50 64 50 64 58 L 64 70 L 52 70 Z" fill="#FFFFFF" />
    <!-- Pointer arm -->
    <line x1="62" y1="52" x2="70" y2="44" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />

    <!-- Tip -->
    <path d="M 46 88 L 58 104 L 70 88 Z" fill="#0B132B" />
    <path d="M 50 88 L 58 100 L 66 88 Z" fill="#F8FAFC" />
    <path d="M 55 95 L 58 102 L 61 95 Z" fill="#00b4d8" />
  </g>

  <!-- Writing Tip Glow -->
  <circle cx="21" cy="98" r="6" fill="#00f5d4" />
  <circle cx="21" cy="98" r="12" fill="#00f5d4" opacity="0.25" />
</svg>
